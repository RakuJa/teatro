[package]
name = "teatro"
version = "1.2.1"
authors = ["RakuJa"]

# Compiler info
edition = "2024"
rust-version = "1.95"

description = ""
readme = "README.md"
homepage = "https://github.com/RakuJa/teatro"
repository = "https://github.com/RakuJa/teatro"
license = "EUPL-1.2"
keywords = []
publish = false

[lints.rust]
unsafe_code = "forbid"
deprecated = "allow"

[lints.clippy]
struct_field_names = { level = "allow", priority = 2 }
module_name_repetitions = { level = "allow", priority = 2 }
# We are ok with losing some data without wrapping. We are not ok with wrapping
# Ex: 128.12 => 128 is ok, 128 => 0 is not.
cast_possible_truncation = { level = "allow", priority = 2 }
cast_precision_loss = { level = "allow", priority = 2 }

future_not_send = { level = "allow", priority = 2 }

pedantic = { level = "warn", priority = 1 }
nursery = { level = "warn", priority = 1 }
unwrap_used = { level = "warn", priority = 1 }


[dependencies]

# audio player
rodio = "0.22"
biquad = "0.6.0"

# midi
ramidier = {version = "0.3.0"}

# various utility
anyhow = "1.0"
env_logger = "0.11"
dotenvy = "0.15.7"
bon = "3.10"
bitflags = "2.13"
fastrand = "2.5"
cfg-if = "1.0.4"

# file dialog
rfd = "0.17"
dirs = "6.0.0"

# Write to config file
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

# comms
flume = "0.12.0"

# gui
eframe = { version = "0.36.1", optional = true }
egui = { version = "0.36.1", optional = true }
egui_font_loader = { version = "0.36.1", optional = true }

# Log
#egui_tracing = "0.3.0" waiting for published update
egui_tracing = { git = "https://github.com/c-git/egui_tracing", rev = "c81c762"}
tracing-subscriber = "0.3.23"
tracing = "0.1.44"

# webview
wry = {version = "0.56.1", optional = true}
tao = { version = "0.37.0", optional = true }

# watchdog folder for changes
hotwatch = { version = "0.5.0", optional = true }
serde_json = "1.0"
[features]
default = ["gui", "bybe", "midi"]
gui = ["dep:egui", "dep:eframe", "dep:egui_font_loader", "dep:hotwatch"]
bybe = ["dep:wry",  "dep:tao", "gui"]
midi = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
